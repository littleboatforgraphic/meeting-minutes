[project]
name = "meeting-minutes"
version = "0.1.0"
description = "Meeting secretary agent: minutes, to-dos and deadlines from meetings, one isolated stack per company"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "numpy>=2.0.0",
    "openai>=1.50.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "rapidfuzz>=3.10.0",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.0",
    "weasyprint>=62.0",
    "webrtcvad-wheels>=2.0.14",
]

[project.optional-dependencies]
# Speaker embeddings (ECAPA) for diarization + voiceprints. CPU-only torch.
voice = [
    "speechbrain>=1.0.0",
    "torch>=2.4.0",
    "torchaudio>=2.4.0",
]

[project.scripts]
mm = "meeting_minutes.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
